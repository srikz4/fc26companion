  <rect x="16" y="86" width="868" height="330" rx="8" fill="#121821" stroke="#1e2732"/>
  <circle cx="46" cy="116" r="15" fill="#1e2732"/>
  <text x="70" y="114" fill="#5c6773" font-size="10">#13</text>
  <text x="100" y="121" fill="#e8eef2" font-size="17" font-weight="800" letter-spacing="0.4">P. DORGU</text>
  <rect x="196" y="106" width="30" height="18" rx="4" fill="#1e2732"/>
  <text x="211" y="119" fill="#8b98a5" font-size="9.5" font-weight="700" text-anchor="middle">LB</text>
  <g>
