        <rect x="110" y="44" width="96" height="6" rx="3" fill="#1e2732"/><rect x="110" y="44" width="79" height="6" rx="3" fill="#38bdf8"/>
        <text x="248" y="50" fill="#38bdf8" font-size="11" font-weight="750" text-anchor="end">82</text>
        <text x="12" y="72">Strength</text>
        <rect x="110" y="66" width="96" height="6" rx="3" fill="#1e2732"/><rect x="110" y="66" width="78" height="6" rx="3" fill="#38bdf8"/>
        <text x="248" y="72" fill="#38bdf8" font-size="11" font-weight="750" text-anchor="end">81</text>
      </g>
