  <line x1="34" y1="350" x2="866" y2="350" stroke="#1e2732"/>
  <text x="34" y="374" fill="#5c6773" font-size="10">Every attribute, exactly as the game shows it — keepers included. The card is dressed for</text>
  <text x="34" y="392" fill="#5c6773" font-size="10">the view that opened it: the full sheet here, the match log under Stats, the money under Financial.</text>
