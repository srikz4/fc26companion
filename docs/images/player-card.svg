      <text x="12" y="20" fill="#5c6773" font-size="9" font-weight="800" letter-spacing="1">PHYSICAL</text>
      <text x="228" y="22" fill="#8b98a5" font-size="15" font-weight="800" text-anchor="end">78</text>
      <text x="252" y="22" fill="#4ade80" font-size="10" font-weight="700" text-anchor="end">+0.3</text>
