  <text x="34" y="300" fill="#5c6773" font-size="9" font-weight="800" letter-spacing="1.2">ELITE FOR HIS POSITION, AND WHERE GROWTH PAYS</text>
  <g>
    <rect x="34" y="310" width="122" height="21" rx="10.5" fill="#4ade80" fill-opacity="0.14"/>
    <text x="95" y="325" fill="#4ade80" font-size="11" font-weight="650" text-anchor="middle">Acceleration 89</text>
    <rect x="164" y="310" width="118" height="21" rx="10.5" fill="#4ade80" fill-opacity="0.14"/>
