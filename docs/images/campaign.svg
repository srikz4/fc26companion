<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="900" height="420" rx="10" fill="#0b0f14"/>

  <!-- hero -->
  <rect x="16" y="16" width="868" height="98" rx="8" fill="#121821" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="34" y="42" fill="#a78bfa" font-size="12" font-weight="800" letter-spacing="1.5">CUSTOM BLEND</text>
  <text x="34" y="62" fill="#a78bfa" font-size="12.5" font-style="italic">"Your rules, held to the same standard."</text>
  <g>
    <rect x="34" y="72" width="86" height="20" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="77" y="86" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="middle">The Treble</text>
    <rect x="128" y="72" width="118" height="20" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="187" y="86" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="middle">Academy Project</text>
    <rect x="254" y="72" width="78" height="20" rx="10" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="293" y="86" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="middle">The Wall</text>
  </g>
  <g>
    <rect x="480" y="76" width="22" height="6" rx="3" fill="#a78bfa" opacity="0.5"/>
    <rect x="508" y="76" width="22" height="6" rx="3" fill="#a78bfa" opacity="0.5"/>
    <rect x="536" y="74" width="22" height="9" rx="4" fill="#a78bfa"/>
    <g fill="#1e2732">
      <rect x="564" y="76" width="22" height="6" rx="3"/><rect x="592" y="76" width="22" height="6" rx="3"/>
      <rect x="620" y="76" width="22" height="6" rx="3"/><rect x="648" y="76" width="22" height="6" rx="3"/>
      <rect x="676" y="76" width="22" height="6" rx="3"/><rect x="704" y="76" width="22" height="6" rx="3"/>
      <rect x="732" y="76" width="22" height="6" rx="3"/><rect x="760" y="76" width="22" height="6" rx="3"/>
      <rect x="788" y="76" width="22" height="6" rx="3"/><rect x="816" y="76" width="22" height="6" rx="3"/>
      <rect x="844" y="76" width="22" height="6" rx="3"/>
    </g>
    <text x="480" y="106" fill="#5c6773" font-size="9.5">Season 3 of a 15-season career</text>
  </g>

  <!-- the arc -->
  <rect x="16" y="126" width="428" height="278" rx="8" fill="#121821" stroke="#1e2732"/>
  <text x="34" y="150" fill="#8b98a5" font-size="10.5" font-weight="800" letter-spacing="1.5">THE ARC</text>
  <text x="34" y="168" fill="#5c6773" font-size="9.5">6 of 12 career milestones, interleaved across three strands</text>
  <rect x="34" y="178" width="392" height="8" rx="4" fill="#1e2732"/>
  <rect x="34" y="178" width="196" height="8" rx="4" fill="#a78bfa"/>

  <line x1="46" y1="204" x2="46" y2="384" stroke="#1e2732" stroke-width="2"/>
  <g>
    <circle cx="46" cy="212" r="11" fill="#a78bfa"/>
    <text x="46" y="216" fill="#0b0f14" font-size="10" font-weight="800" text-anchor="middle">✓</text>
    <text x="68" y="210" fill="#8b98a5" font-size="12" font-weight="600">Win the league</text>
    <rect x="176" y="200" width="70" height="14" rx="7" fill="none" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="211" y="210" fill="#a78bfa" font-size="8" font-weight="800" text-anchor="middle">THE TREBLE</text>
  </g>
  <g transform="translate(0,44)">
    <circle cx="46" cy="212" r="11" fill="#a78bfa"/>
    <text x="46" y="216" fill="#0b0f14" font-size="10" font-weight="800" text-anchor="middle">✓</text>
    <text x="68" y="210" fill="#8b98a5" font-size="12" font-weight="600">An academy product in the XI</text>
    <rect x="264" y="200" width="106" height="14" rx="7" fill="none" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="317" y="210" fill="#a78bfa" font-size="8" font-weight="800" text-anchor="middle">ACADEMY PROJECT</text>
  </g>
  <g transform="translate(0,88)">
    <circle cx="46" cy="212" r="11" fill="#121821" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="46" cy="212" r="15" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="3"/>
    <text x="46" y="216" fill="#a78bfa" font-size="9" font-weight="800" text-anchor="middle">▶</text>
    <text x="68" y="210" fill="#a78bfa" font-size="12" font-weight="800">Under 1.0 conceded a game</text>
    <rect x="256" y="200" width="62" height="14" rx="7" fill="none" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="287" y="210" fill="#a78bfa" font-size="8" font-weight="800" text-anchor="middle">THE WALL</text>
    <rect x="326" y="200" width="76" height="14" rx="7" fill="#a78bfa" fill-opacity="0.15"/>
    <text x="364" y="210" fill="#a78bfa" font-size="8" font-weight="800" text-anchor="middle">YOU ARE HERE</text>
  </g>
  <g transform="translate(0,132)">
    <circle cx="46" cy="212" r="11" fill="#0e1117" stroke="#2a3441"/>
    <text x="68" y="210" fill="#5c6773" font-size="12">Win the Champions League</text>
  </g>
  <g transform="translate(0,168)">
    <circle cx="46" cy="212" r="11" fill="#0e1117" stroke="#2a3441"/>
    <text x="68" y="210" fill="#5c6773" font-size="12">Three academy players in the XI</text>
  </g>

  <!-- this season -->
  <rect x="458" y="126" width="426" height="138" rx="8" fill="#121821" stroke="#1e2732"/>
  <text x="476" y="150" fill="#8b98a5" font-size="10.5" font-weight="800" letter-spacing="1.5">THIS SEASON</text>
  <rect x="476" y="160" width="120" height="22" rx="4" fill="#a78bfa" fill-opacity="0.12"/>
  <rect x="476" y="160" width="3" height="22" fill="#a78bfa"/>
  <text x="488" y="175" fill="#a78bfa" font-size="11" font-weight="650">Three fronts</text>
  <g>
    <rect x="476" y="192" width="390" height="30" rx="5" fill="#0e1117" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="488" y="206" fill="#a78bfa" font-size="11.5" font-weight="750">✓ Stay alive everywhere</text>
    <text x="854" y="206" fill="#5c6773" font-size="9.5" text-anchor="end">3 competitions running</text>
    <rect x="488" y="212" width="366" height="5" rx="2.5" fill="#1e2732"/><rect x="488" y="212" width="366" height="5" rx="2.5" fill="#a78bfa"/>
  </g>
  <g>
    <rect x="476" y="228" width="390" height="30" rx="5" fill="#0e1117" stroke="#1e2732"/>
    <text x="488" y="242" fill="#e8eef2" font-size="11.5" font-weight="750">Academy minutes</text>
    <text x="854" y="242" fill="#5c6773" font-size="9.5" text-anchor="end">6.2% of all minutes — target 15%</text>
    <rect x="488" y="248" width="366" height="5" rx="2.5" fill="#1e2732"/><rect x="488" y="248" width="151" height="5" rx="2.5" fill="#a78bfa"/>
  </g>

  <!-- right now -->
  <rect x="458" y="276" width="426" height="128" rx="8" fill="#121821" stroke="#1e2732"/>
  <text x="476" y="300" fill="#8b98a5" font-size="10.5" font-weight="800" letter-spacing="1.5">RIGHT NOW</text>
  <g>
    <rect x="476" y="310" width="390" height="28" rx="5" fill="#0e1117" stroke="#1e2732"/>
    <text x="488" y="323" fill="#e8eef2" font-size="11" font-weight="750">Mbeumo to 15</text>
    <text x="854" y="323" fill="#5c6773" font-size="9.5" text-anchor="end">11 goals — 4 to the next mark</text>
    <rect x="488" y="329" width="366" height="4" rx="2" fill="#1e2732"/><rect x="488" y="329" width="268" height="4" rx="2" fill="#a78bfa"/>
  </g>
  <g>
    <rect x="476" y="344" width="390" height="28" rx="5" fill="#0e1117" stroke="#1e2732"/>
    <text x="488" y="357" fill="#e8eef2" font-size="11" font-weight="750">Minutes for Holt</text>
    <text x="854" y="357" fill="#5c6773" font-size="9.5" text-anchor="end">0' so far — get to 300 before June</text>
    <rect x="488" y="363" width="366" height="4" rx="2" fill="#1e2732"/><rect x="488" y="363" width="8" height="4" rx="2" fill="#a78bfa"/>
  </g>
  <text x="476" y="392" fill="#5c6773" font-size="9.5">Every number computed from your save. Nothing is rolled.</text>
</svg>
